[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "chroma_db",
    "classified_docs",
    "clean_docs",
    "data",
    "terminology",
    "venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.isort]
known-first-party = [
    "amie",
    "app",
    "domain",
    "infrastructure",
    "knowledge",
    "scripts",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pyright]
include = [
    "amie",
    "app",
    "domain",
    "infrastructure",
    "knowledge",
    "scripts",
    "main.py",
]
exclude = [
    "**/__pycache__",
    "chroma_db",
    "classified_docs",
    "clean_docs",
    "data",
    "terminology",
    "venv",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
venvPath = "."
venv = "venv"

[tool.coverage.run]
branch = true
source = [
    "amie",
    "app",
    "domain",
    "infrastructure",
    "knowledge",
    "scripts",
]
omit = [
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.vulture]
exclude = [
    "venv/",
]
ignore_decorators = [
    "@app.*",
    "@router.*",
]
min_confidence = 80
paths = [
    "amie",
    "app",
    "domain",
    "infrastructure",
    "knowledge",
    "scripts",
    "main.py",
]
sort_by_size = true
