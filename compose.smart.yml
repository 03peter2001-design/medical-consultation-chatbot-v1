services:
  backend:
    build:
      context: ./backend
    image: chest-pain-ai-doctor-backend:local
    env_file:
      - ./backend/.env
    environment:
      CONSULTATION_DB_PATH: /app/data/consultations.db
      FHIR_BASE_URL: http://hapi:8080/fhir
      HF_HUB_CACHE: /models/hub
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      ANONYMIZED_TELEMETRY: "FALSE"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - consultation-data:/app/data
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/terminology/snomed:/app/terminology/snomed:ro
      - "${RAG_HF_HUB_CACHE:-./.rag-cache/huggingface/hub}:/models/hub:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  fhir-root-proxy:
    image: nginx:alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./smart-deployment/fhir-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  smart-launcher:
    image: smartonfhir/smart-launcher-2:latest
    depends_on:
      fhir-root-proxy:
        condition: service_started
    environment:
      FHIR_SERVER_R2: ""
      FHIR_SERVER_R3: ""
      FHIR_SERVER_R4: "http://fhir-root-proxy"
      SECRET: "${SMART_LAUNCHER_SECRET:-local-development-only-change-me}"
    restart: unless-stopped

  smart-launcher-gateway:
    image: nginx:alpine
    depends_on:
      smart-launcher:
        condition: service_started
    volumes:
      - ./smart-deployment/smart-launcher-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SMART_LAUNCHER_PORT:-8090}:80"
    restart: unless-stopped

  smart-app:
    build:
      context: .
      dockerfile: smart-app/Dockerfile
    image: chest-pain-ai-doctor-smart-app:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SMART_APP_PORT:-5174}:80"
    restart: unless-stopped

volumes:
  consultation-data:
