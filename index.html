<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 預問診系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0b0f14;
    --s1:       #111822;
    --s2:       #182030;
    --border:   #1e2d3d;
    --border2:  #2a3f55;
    --accent:   #00c896;
    --blue:     #4fa3e0;
    --text:     #d4e4f4;
    --muted:    #4a6478;
    --danger:   #e05252;
    --r:        10px;
    --header-h: 52px;
    --input-h:  64px;
  }

  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Noto Serif TC',serif; }

  /* ── 開始遮罩 ── */
  #startOverlay {
    position: absolute;
    top: 0; right: 0;
    bottom: 0;
    left: 300px; /* 左側面板寬度 */
    background: rgba(11,15,20,.93);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 200;
    transition: opacity .5s ease;
  }
  #startOverlay.hide { opacity:0; pointer-events:none; }
  #startOverlay .ov-logo {
    width:64px; height:64px; background:var(--accent); border-radius:18px;
    display:flex; align-items:center; justify-content:center; font-size:32px;
    box-shadow:0 0 40px rgba(0,200,150,.3);
  }
  #startOverlay .ov-title { font-size:24px; font-weight:600; color:var(--text); letter-spacing:.04em; }
  #startOverlay .ov-sub { font-size:12px; color:var(--muted); font-family:'JetBrains Mono',monospace; text-align:center; line-height:1.8; }
  #btnStart {
    margin-top:8px; background:var(--accent); color:#001a12; border:none; border-radius:10px;
    padding:14px 48px; font-size:16px; font-weight:600; cursor:pointer; font-family:'Noto Serif TC',serif;
    opacity:.3; pointer-events:none; transition:opacity .3s,transform .1s,box-shadow .3s;
  }
  #btnStart.ready { opacity:1; pointer-events:auto; box-shadow:0 0 24px rgba(0,200,150,.4); }
  #btnStart.ready:hover { opacity:.85; }
  #btnStart.ready:active { transform:scale(.97); }

  #app { display:flex; flex-direction:column; width:100vw; height:100vh; overflow:hidden; }

  #header {
    height:var(--header-h); flex-shrink:0; background:var(--s1); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px; gap:10px; z-index:10;
  }
  #header .logo { width:28px; height:28px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  #header h1 { font-size:15px; font-weight:600; letter-spacing:.04em; }
  #header .conn-badge { margin-left:auto; display:flex; align-items:center; gap:6px; font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted); }
  #header .conn-badge .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:background .3s; }
  #header .conn-badge .dot.on      { background:var(--accent); animation:blink 2s infinite; }
  #header .conn-badge .dot.talking { background:var(--blue);   animation:blink .5s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  #main { flex:1; display:flex; overflow:hidden; }

  #left { width:300px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--border); background:var(--s1); overflow:hidden; }

  #avatarWrap { position:relative; width:100%; aspect-ratio:3/4; flex-shrink:0; background:var(--s2); overflow:hidden; }
  #avatarWrap video { width:100%; height:100%; object-fit:cover; display:block; }
  #avatarPlaceholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:12px; font-family:'JetBrains Mono',monospace; text-align:center; line-height:1.6; }
  #avatarPlaceholder .big { font-size:40px; opacity:.25; }
  #avatarPlaceholder.hide { display:none; }

  #waveOverlay { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:none; align-items:flex-end; gap:3px; height:20px; }
  #waveOverlay.show { display:flex; }
  #waveOverlay span { display:block; width:4px; border-radius:3px; background:var(--blue); opacity:.85; animation:wv .7s ease-in-out infinite; }
  #waveOverlay span:nth-child(1){height:8px;  animation-delay:0s}
  #waveOverlay span:nth-child(2){height:16px; animation-delay:.1s}
  #waveOverlay span:nth-child(3){height:10px; animation-delay:.2s}
  #waveOverlay span:nth-child(4){height:18px; animation-delay:.3s}
  #waveOverlay span:nth-child(5){height:8px;  animation-delay:.4s}
  @keyframes wv { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(.3)} }

  #configPanel { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .cfg-title { font-size:10px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .cfg-field { display:flex; flex-direction:column; gap:4px; }
  .cfg-field label { font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace; letter-spacing:.06em; }
  .cfg-field input { background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:7px 10px; font-size:11px; font-family:'JetBrains Mono',monospace; outline:none; transition:border-color .2s; width:100%; }
  .cfg-field input:focus { border-color:var(--blue); }
  .cfg-field input::placeholder { color:var(--muted); opacity:.5; }

  .btn-primary { background:var(--accent); color:#001a12; border:none; border-radius:7px; padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Noto Serif TC',serif; transition:opacity .2s,transform .1s; width:100%; }
  .btn-primary:hover { opacity:.85; }
  .btn-primary:active { transform:scale(.98); }
  .btn-primary:disabled { opacity:.35; cursor:not-allowed; }

  .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:7px; padding:9px 12px; font-size:12px; cursor:pointer; font-family:'Noto Serif TC',serif; width:100%; transition:border-color .2s,color .2s; display:none; }
  .btn-ghost:hover { border-color:var(--border2); color:var(--text); }

  #cfgStatus { font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted); text-align:center; }
  .divider { border:none; border-top:1px solid var(--border); }
  .hint { font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted); line-height:1.8; }
  .hint a { color:var(--blue); text-decoration:none; }

  #right { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

  #progressBar { flex-shrink:0; height:44px; padding:0 20px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); background:var(--s1); }
  .step-pip { width:7px; height:7px; border-radius:50%; background:var(--border2); transition:background .3s,transform .2s; flex-shrink:0; }
  .step-pip.done    { background:var(--accent); }
  .step-pip.current { background:var(--blue); transform:scale(1.3); animation:blink 1s infinite; }
  #stepText { margin-left:auto; font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted); }

  #chatbox { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
  #chatbox::-webkit-scrollbar { width:4px; }
  #chatbox::-webkit-scrollbar-track { background:transparent; }
  #chatbox::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

  .msg { display:flex; flex-direction:column; gap:3px; max-width:72%; animation:popIn .2s ease; }
  @keyframes popIn { from{opacity:0;transform:translateY(10px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg.user { align-self:flex-end;   align-items:flex-end; }
  .msg.ai   { align-self:flex-start; align-items:flex-start; }
  .msg .who { font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--muted); letter-spacing:.06em; padding:0 4px; }
  .msg.ai   .bubble { background:var(--s2); border:1px solid var(--border); color:var(--text); border-radius:3px 12px 12px 12px; padding:10px 14px; font-size:14px; line-height:1.75; }
  .msg.user .bubble { background:var(--accent); color:#001a12; border-radius:12px 3px 12px 12px; padding:10px 14px; font-size:14px; line-height:1.75; }

  .report { align-self:stretch; border:1px solid var(--accent); background:rgba(0,200,150,.05); border-radius:var(--r); padding:16px 18px; animation:popIn .3s ease; }
  .report h3 { font-size:12px; color:var(--accent); letter-spacing:.08em; margin-bottom:10px; font-family:'JetBrains Mono',monospace; }
  .report pre { font-family:'Noto Serif TC',serif; font-size:13px; white-space:pre-wrap; line-height:1.85; color:var(--text); }

  #inputBar { flex-shrink:0; height:var(--input-h); padding:0 16px; display:flex; align-items:center; gap:8px; border-top:1px solid var(--border); background:var(--s1); }
  #inputBar input { flex:1; background:var(--s2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 14px; font-size:14px; font-family:'Noto Serif TC',serif; outline:none; transition:border-color .2s; height:42px; }
  #inputBar input:focus { border-color:var(--blue); }
  #inputBar input::placeholder { color:var(--muted); opacity:.6; }
  #inputBar input:disabled { opacity:.35; }

  .icon-btn { width:42px; height:42px; background:var(--s2); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; transition:background .15s,border-color .15s; flex-shrink:0; }
  .icon-btn:hover { background:var(--border); border-color:var(--border2); }
  .icon-btn:disabled { opacity:.3; cursor:not-allowed; }
  .icon-btn.send { background:var(--accent); border-color:var(--accent); color:#001a12; }
  .icon-btn.send:hover { opacity:.85; }
  .icon-btn.recording { background:var(--danger); border-color:var(--danger); }
</style>
</head>
<body>

<div id="startOverlay">
  <div class="ov-logo">🩺</div>
  <div class="ov-title">AI 預問診系統</div>
  <div class="ov-sub" id="overlayStatus">請在左側填入 D-ID 金鑰<br>連接成功後即可開始</div>
  <button id="btnStart" onclick="startSession()">開始問診</button>
</div>

<div id="app">
  <div id="header">
    <div class="logo">🩺</div>
    <h1>AI 預問診系統</h1>
    <div class="conn-badge">
      <div class="dot" id="connDot"></div>
      <span id="connText">未連線</span>
    </div>
  </div>

  <div id="main">
    <div id="left">
      <div id="avatarWrap">
        <div id="avatarPlaceholder">
          <div class="big">👤</div>
          <div>填入設定後<br>點擊「連接 Avatar」</div>
        </div>
        <video id="agentVideo" autoplay playsinline></video>
        <div id="waveOverlay">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div id="configPanel">
        <div class="cfg-title">D-ID 設定</div>
        <div class="cfg-field">
          <label>CLIENT KEY</label>
          <input type="password" id="clientKey" placeholder="ck_..." />
        </div>
        <div class="cfg-field">
          <label>AGENT ID</label>
          <input type="text" id="agentId" placeholder="v2_agt_..." />
        </div>
        <button class="btn-primary" id="btnConnect" onclick="connectAvatar()">連接 Avatar</button>
        <button class="btn-ghost"   id="btnDisconnect" onclick="disconnectAvatar()">中斷連線</button>
        <div id="cfgStatus">請輸入 D-ID 金鑰</div>
        <hr class="divider">
        <div class="cfg-title">取得金鑰方式</div>
        <div class="hint">
          1. 前往 <a href="https://studio.d-id.com" target="_blank">studio.d-id.com</a><br>
          2. 建立 Agent → Embed → 複製金鑰<br>
          3. 填入上方欄位後連接
        </div>
      </div>
    </div>

    <div id="right">
      <div id="progressBar">
        <div class="step-pip current" id="p1"></div>
        <div class="step-pip" id="p2"></div>
        <div class="step-pip" id="p3"></div>
        <div class="step-pip" id="p4"></div>
        <div class="step-pip" id="p5"></div>
        <span id="stepText">步驟 1 / 5 — 就診原因</span>
      </div>
      <div id="chatbox"></div>
      <div id="inputBar">
        <input type="text" id="textInput" placeholder="請輸入您的回覆..." disabled />
        <button class="icon-btn" id="btnMic" onclick="startVoice()" disabled>🎤</button>
        <button class="icon-btn send" id="btnSend" onclick="sendMessage()" disabled>➤</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import * as did from "https://esm.sh/@d-id/client-sdk@1";
  window._did = did;
</script>

<script>
const SESSION_ID = Date.now().toString();
const BACKEND    = "http://127.0.0.1:8000";
const STEP_NAMES = ["","就診原因","性別","年齡","症狀描述","病史"];

let isCompleted  = false;
let currentStep  = 1;
let agentManager = null;

const chatbox       = document.getElementById("chatbox");
const textInput     = document.getElementById("textInput");
const btnSend       = document.getElementById("btnSend");
const btnMic        = document.getElementById("btnMic");
const btnConnect    = document.getElementById("btnConnect");
const btnDisconnect = document.getElementById("btnDisconnect");
const cfgStatus     = document.getElementById("cfgStatus");
const connDot       = document.getElementById("connDot");
const connText      = document.getElementById("connText");
const placeholder   = document.getElementById("avatarPlaceholder");
const videoEl       = document.getElementById("agentVideo");
const waveOverlay   = document.getElementById("waveOverlay");
const overlayEl     = document.getElementById("startOverlay");
const overlayStatus = document.getElementById("overlayStatus");
const btnStart      = document.getElementById("btnStart");

// ── 開始遮罩 ──
async function startSession() {
  if (!agentManager) return;
  overlayEl.classList.add("hide");
  setTimeout(() => overlayEl.remove(), 500);
  setTimeout(async () => { await startConsultation(); }, 2000);
}

// ── D-ID Avatar ──
async function waitForSDK(timeout = 5000) {
  const start = Date.now();
  while (!window._did) {
    if (Date.now() - start > timeout) throw new Error("D-ID SDK 載入逾時");
    await new Promise(r => setTimeout(r, 200));
  }
}

async function connectAvatar() {
  const clientKey = document.getElementById("clientKey").value.trim();
  const agentId   = document.getElementById("agentId").value.trim();
  if (!clientKey || !agentId) { setStatus("請填入 Client Key 和 Agent ID","err"); return; }
  setStatus("SDK 載入中...","wait");
  btnConnect.disabled = true;
  try { await waitForSDK(); }
  catch (e) { setStatus("SDK 載入失敗，請重新整理頁面","err"); btnConnect.disabled=false; return; }
  setStatus("連接中...","wait");
  try {
    agentManager = await window._did.createAgentManager(agentId, {
      auth: { type:"key", clientKey },
      callbacks: {
        onSrcObjectReady(v) { videoEl.srcObject=v; placeholder.classList.add("hide"); },
        onConnectionStateChange(state) {
          if (state === "connected") {
            setStatus("已連線 ✓","ok");
            connDot.className = "dot on";
            connText.textContent = "已連線";
            btnConnect.style.display    = "none";
            btnDisconnect.style.display = "block";
            overlayStatus.textContent = "Avatar 已就緒，點擊開始問診 👇";
            btnStart.classList.add("ready");
          } else if (state === "disconnected" || state === "failed") {
            setStatus("連線中斷","err");
            connDot.className = "dot";
            connText.textContent = "未連線";
            btnConnect.style.display    = "block";
            btnConnect.disabled         = false;
            btnDisconnect.style.display = "none";
            btnStart.classList.remove("ready");
            overlayStatus.textContent = "請在左側填入 D-ID 金鑰\n連接成功後即可開始";
          }
        },
        onVideoStateChange(state) {
          const talking = state === "PLAY";
          waveOverlay.className = talking ? "show" : "";
          connDot.className = "dot " + (talking ? "talking" : "on");
        },
        onError(err) { setStatus("連接失敗："+(err.message||err),"err"); btnConnect.disabled=false; }
      }
    });
    await agentManager.connect();
  } catch (err) { setStatus("連接失敗："+err.message,"err"); btnConnect.disabled=false; }
}

async function disconnectAvatar() {
  if (!agentManager) return;
  try { await agentManager.disconnect(); } catch {}
  agentManager=null; videoEl.srcObject=null;
  placeholder.classList.remove("hide"); waveOverlay.className="";
  connDot.className="dot"; connText.textContent="未連線";
  setStatus("已中斷連線","");
  btnConnect.style.display="block"; btnConnect.disabled=false; btnDisconnect.style.display="none";
}

function setStatus(msg,type) {
  cfgStatus.textContent = msg;
  cfgStatus.style.color = type==="ok" ? "var(--accent)" : type==="err" ? "var(--danger)" : type==="wait" ? "var(--blue)" : "var(--muted)";
}

async function avatarSpeak(text) {
  if (!agentManager) return;
  const clean = text.replace(/【.*?】/g,"").replace(/\n+/g," ").trim();
  try { await agentManager.speak({ type:"text", input:clean }); }
  catch (e) { console.warn("avatarSpeak error:",e); }
}

// ── Chat ──
async function startConsultation() {
  setInputsDisabled(true);
  const data = await callBackend("");
  if (!data) { setInputsDisabled(false); return; }
  addBubble("ai", data.reply);
  avatarSpeak(data.reply);
  updateProgress(1);
  setInputsDisabled(false);
  textInput.focus();
}

async function sendMessage() {
  if (isCompleted) return;
  const msg = textInput.value.trim();
  if (!msg) return;
  addBubble("user", msg);
  textInput.value = "";
  setInputsDisabled(true);
  const data = await callBackend(msg);
  if (!data) { setInputsDisabled(false); return; }
  if (data.completed) {
    showReport(data.reply);
    avatarSpeak(data.reply);
    isCompleted = true;
    updateProgress(6);
  } else {
    addBubble("ai", data.reply);
    avatarSpeak(data.reply);
    currentStep = Math.min(currentStep+1, 5);
    updateProgress(currentStep);
    setInputsDisabled(false);
    textInput.focus();
  }
}

async function callBackend(message) {
  try {
    const r = await fetch(`${BACKEND}/chat`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ message, session_id:SESSION_ID })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    addBubble("ai","⚠️ 無法連接後端（"+e.message+"），請確認 FastAPI 已啟動。");
    return null;
  }
}

function addBubble(role, text) {
  const wrap=document.createElement("div"); wrap.className="msg "+role;
  const who=document.createElement("div"); who.className="who"; who.textContent=role==="ai"?"AI 助理":"您";
  const bubble=document.createElement("div"); bubble.className="bubble"; bubble.textContent=text;
  wrap.appendChild(who); wrap.appendChild(bubble);
  chatbox.appendChild(wrap); chatbox.scrollTop=chatbox.scrollHeight;
}

function showReport(text) {
  const card=document.createElement("div"); card.className="report";
  card.innerHTML=`<h3>📋 AI 預問診報告</h3><pre>${text}</pre>`;
  chatbox.appendChild(card); chatbox.scrollTop=chatbox.scrollHeight;
}

function setInputsDisabled(v) { textInput.disabled=v; btnSend.disabled=v; btnMic.disabled=v; }

function updateProgress(step) {
  for (let i=1;i<=5;i++) {
    document.getElementById("p"+i).className="step-pip"+(i<step?" done":i===step?" current":"");
  }
  document.getElementById("stepText").textContent=step>5?"問診完成 ✓":`步驟 ${step} / 5 — ${STEP_NAMES[step]}`;
}

// ── 語音輸入 ──
let mediaRecorder=null, audioChunks=[], isRecording=false;

async function startVoice() {
  if (isCompleted) return;
  if (isRecording) { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{ channelCount:1, sampleRate:16000, echoCancellation:true, noiseSuppression:true }
    });
    audioChunks=[]; mediaRecorder=new MediaRecorder(stream,{mimeType:"audio/webm;codecs=opus"});
    mediaRecorder.ondataavailable=e=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop=async()=>{
      isRecording=false; btnMic.textContent="🎤"; btnMic.classList.remove("recording");
      stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:"audio/webm;codecs=opus"});
      const form=new FormData(); form.append("audio",blob,"audio.webm");
      btnMic.disabled=true; btnMic.textContent="⏳";
      try {
        const res=await fetch(`${BACKEND}/transcribe`,{method:"POST",body:form});
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data=await res.json();
        if (data.text&&data.text.trim()) { textInput.value=data.text.trim(); sendMessage(); }
        else addBubble("ai","⚠️ 未偵測到語音內容，請再試一次。");
      } catch(e) { addBubble("ai","⚠️ 語音辨識失敗（"+e.message+"），請重試。"); }
      finally { btnMic.disabled=false; btnMic.textContent="🎤"; }
    };
    mediaRecorder.start(); isRecording=true; btnMic.textContent="⏹️"; btnMic.classList.add("recording");
  } catch(e) { addBubble("ai","⚠️ 無法存取麥克風："+e.message); }
}

textInput.addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();} });

window.addEventListener("load",()=>{
  navigator.mediaDevices?.getUserMedia?.({audio:true}).then(s=>s.getTracks().forEach(t=>t.stop())).catch(()=>{});
});

window.connectAvatar=connectAvatar; window.disconnectAvatar=disconnectAvatar;
window.sendMessage=sendMessage; window.startVoice=startVoice; window.startSession=startSession;
</script>
