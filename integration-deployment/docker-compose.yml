name: ${COMPOSE_PROJECT_NAME:-medical-consultation}

services:
  backend:
    build:
      context: ../backend
    image: medical-consultation-backend:local
    env_file:
      - .env
    environment:
      CONSULTATION_DB_PATH: /var/lib/medical-consultation/consultations.db
      UCC_JWT_PUBLIC_KEY_PATH: /run/secrets/ucc-jwt-public.pem
      ENABLE_UNVERSIONED_ALIASES: "false"
      CORS_ALLOWED_ORIGINS: ""
      HF_HUB_CACHE: /models/hub
      BREEZE_ASR_RELEASE_GPU_AFTER_TRANSCRIBE: ${BREEZE_ASR_RELEASE_GPU_AFTER_TRANSCRIBE:-true}
      AVATAR_ENABLED: ${AVATAR_ENABLED:-true}
      AVATAR_SERVICE_URL: http://avatar:8090
      AVATAR_TIMEOUT_SECONDS: ${AVATAR_TIMEOUT_SECONDS:-600}
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-access-log
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - consultation-data:/var/lib/medical-consultation
      - ./backups:/backups
      - ./secrets/ucc-jwt-public.pem:/run/secrets/ucc-jwt-public.pem:ro
      - ${RAG_CHROMA_DB_PATH:-../backend/chroma_db}:/app/chroma_db:ro
      - ${SNOMED_DATA_PATH:-../backend/terminology/snomed}:/app/terminology/snomed:ro
      # Breeze-ASR is lazy-loaded and may populate this cache on first use.
      - ${HF_MODEL_CACHE_PATH:-../.rag-cache/huggingface/hub}:/models/hub
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - private-api
      - backend-egress

  avatar:
    build:
      context: ..
      dockerfile: avatar-service/Dockerfile
    image: medical-consultation-avatar:local
    environment:
      AVATAR_DATA_DIR: /data
      AVATAR_MODEL_DIR: /models/avatar
      AVATAR_IMAGE_PATH: /app/assets/doctor.png
      AVATAR_REQUIRE_CUDA: ${AVATAR_REQUIRE_CUDA:-true}
      AVATAR_STATIC_FALLBACK: ${AVATAR_STATIC_FALLBACK:-true}
      AVATAR_RELEASE_GPU_AFTER_RENDER: ${AVATAR_RELEASE_GPU_AFTER_RENDER:-true}
      AVATAR_OUTPUT_WIDTH: ${AVATAR_OUTPUT_WIDTH:-768}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-8}
      MUSETALK_FACE_BBOX: ${MUSETALK_FACE_BBOX:-585,140,915,520}
      COSYVOICE_MODEL: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
      COSYVOICE_PROMPT_WAV: /app/assets/voice-prompt.wav
      HF_HOME: /models/huggingface
    command:
      - python3.10
      - -m
      - uvicorn
      - app.main:app
      - --app-dir
      - /app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --workers
      - "1"
      - --no-access-log
    expose:
      - "8090"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - avatar-models:/models
      - avatar-cache:/data
    healthcheck:
      test:
        - CMD
        - python3.10
        - -c
        - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)); raise SystemExit(0 if data['status']=='ok' else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - private-api
      - backend-egress

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: ^(PATIENT_SERVER_NAME|UCC_SOURCE_CIDR|AVATAR_UPSTREAM_TIMEOUT|AVATAR_CSP_CONNECT_SRC_SUFFIX)$
      PATIENT_SERVER_NAME: ${PATIENT_SERVER_NAME:?set PATIENT_SERVER_NAME}
      UCC_SOURCE_CIDR: ${UCC_SOURCE_CIDR:?set UCC_SOURCE_CIDR}
      AVATAR_UPSTREAM_TIMEOUT: "${AVATAR_TIMEOUT_SECONDS:-600}s"
      # Empty by default so manual Compose runs retain the strict local CSP.
      # deploy-ubuntu.sh sets the exact D-ID origins only for provider `did`.
      AVATAR_CSP_CONNECT_SRC_SUFFIX: "${AVATAR_CSP_CONNECT_SRC_SUFFIX:-}"
    ports:
      - ${PATIENT_HTTPS_BIND:-0.0.0.0}:443:443
      - ${UCC_API_BIND_IP:?set UCC_API_BIND_IP}:8443:8443
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../frontend-v2/apps/patient/dist:/usr/share/nginx/html:ro
      # Keep this outside the read-only SPA bind mount. Nginx exposes it at
      # /avatar/doctor.png via an exact alias below.
      - "../pic/dr training pc.png:/usr/share/nginx/avatar-doctor.png:ro"
      - ./secrets/tls-fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./secrets/tls-private-key.pem:/etc/nginx/tls/private-key.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - private-api

networks:
  private-api:
    internal: true
  # Only the backend joins this un-published network, so it can reach the chosen
  # LLM/FHIR providers without exposing port 8000 on the Ubuntu host.
  backend-egress:
    driver: bridge

volumes:
  consultation-data:
  avatar-models:
  avatar-cache:
