name: ${COMPOSE_PROJECT_NAME:-medical-consultation}

services:
  backend:
    build:
      context: ../backend
    image: medical-consultation-backend:local
    env_file:
      - .env
    environment:
      CONSULTATION_DB_PATH: /var/lib/medical-consultation/consultations.db
      UCC_JWT_PUBLIC_KEY_PATH: /run/secrets/ucc-jwt-public.pem
      ENABLE_UNVERSIONED_ALIASES: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      HF_HUB_CACHE: /models/hub
      BREEZE_ASR_RELEASE_GPU_AFTER_TRANSCRIBE: ${BREEZE_ASR_RELEASE_GPU_AFTER_TRANSCRIBE:-false}
      AVATAR_ENABLED: ${AVATAR_ENABLED:-true}
      AVATAR_SERVICE_URL: http://avatar:8090
      AVATAR_TIMEOUT_SECONDS: ${AVATAR_TIMEOUT_SECONDS:-600}
      # Normal frontend -> backend requests use this default unless the API
      # request explicitly overrides animation for that render.
      AVATAR_ANIMATION_ENABLED: ${AVATAR_ANIMATION_ENABLED:-true}
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-access-log
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - consultation-data:/var/lib/medical-consultation
      - ./backups:/backups
      - ./secrets/ucc-jwt-public.pem:/run/secrets/ucc-jwt-public.pem:ro
      # Chroma PersistentClient performs SQLite bookkeeping even for retrieval,
      # so its working index cannot be mounted read-only.
      - ${RAG_CHROMA_DB_PATH:-../backend/chroma_db}:/app/chroma_db
      - ${SNOMED_DATA_PATH:-../backend/terminology/snomed}:/app/terminology/snomed:ro
      # Breeze-ASR is lazy-loaded and may populate this cache on first use.
      - ${HF_MODEL_CACHE_PATH:-../.rag-cache/huggingface/hub}:/models/hub
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - private-api
      - backend-egress

  avatar:
    build:
      context: ..
      dockerfile: avatar-service/Dockerfile
    image: medical-consultation-avatar:local
    environment:
      AVATAR_DATA_DIR: /data
      AVATAR_MODEL_DIR: /models/avatar
      AVATAR_IMAGE_PATH: /app/assets/doctor.png
      AVATAR_REQUIRE_CUDA: ${AVATAR_REQUIRE_CUDA:-true}
      AVATAR_STATIC_FALLBACK: ${AVATAR_STATIC_FALLBACK:-true}
      # Service-level fallback for direct callers that omit a request override.
      AVATAR_ANIMATION_ENABLED: ${AVATAR_ANIMATION_ENABLED:-true}
      AVATAR_RELEASE_GPU_AFTER_RENDER: ${AVATAR_RELEASE_GPU_AFTER_RENDER:-false}
      AVATAR_OUTPUT_WIDTH: ${AVATAR_OUTPUT_WIDTH:-768}
      MUSETALK_BATCH_SIZE: ${MUSETALK_BATCH_SIZE:-8}
      MUSETALK_FACE_BBOX: ${MUSETALK_FACE_BBOX:-585,140,915,520}
      COSYVOICE_MODEL: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
      COSYVOICE_PROMPT_WAV: /app/assets/voice-prompt.wav
      HF_HOME: /models/huggingface
    command:
      - python3.10
      - -m
      - uvicorn
      - app.main:app
      - --app-dir
      - /app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --workers
      - "1"
      - --no-access-log
    expose:
      - "8090"
    # Let a host-run development backend reach the GPU service without joining
    # the Compose network. Keep this model API on loopback, never on the LAN.
    ports:
      - "127.0.0.1:${AVATAR_HOST_PORT:-8090}:8090"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - avatar-models:/models
      - avatar-cache:/data
    healthcheck:
      test:
        - CMD
        - python3.10
        - -c
        - import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)); raise SystemExit(0 if data['status']=='ok' else 1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - private-api
      - backend-egress

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: ^(PATIENT_SERVER_NAME|UCC_SOURCE_CIDR|AVATAR_UPSTREAM_TIMEOUT|AVATAR_CSP_CONNECT_SRC_SUFFIX)$
      PATIENT_SERVER_NAME: ${PATIENT_SERVER_NAME:?set PATIENT_SERVER_NAME}
      UCC_SOURCE_CIDR: ${UCC_SOURCE_CIDR:?set UCC_SOURCE_CIDR}
      AVATAR_UPSTREAM_TIMEOUT: "${AVATAR_TIMEOUT_SECONDS:-600}s"
      # Empty by default so manual Compose runs retain the strict local CSP.
      # deploy-ubuntu.sh sets the exact D-ID origins only for provider `did`.
      AVATAR_CSP_CONNECT_SRC_SUFFIX: "${AVATAR_CSP_CONNECT_SRC_SUFFIX:-}"
    ports:
      # Development frontend reaches Docker only through this loopback gateway;
      # FastAPI itself remains unpublished.
      - "127.0.0.1:${DEVELOPMENT_API_PORT:-18000}:8000"
      - ${PATIENT_HTTPS_BIND:-0.0.0.0}:${PATIENT_HTTPS_PORT:-443}:443
      - ${UCC_API_BIND_IP:?set UCC_API_BIND_IP}:${UCC_API_PORT:-8443}:8443
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../frontend-v2/apps/patient/dist:/usr/share/nginx/html:ro
      # Keep this outside the read-only SPA bind mount. Nginx exposes it at
      # /avatar/doctor.png via an exact alias below.
      - "../pic/dr training pc.png:/usr/share/nginx/avatar-doctor.png:ro"
      - ./secrets/tls-fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./secrets/tls-private-key.pem:/etc/nginx/tls/private-key.pem:ro
    healthcheck:
      # Exercise the real Nginx -> FastAPI path so a broken upstream cannot
      # leave the gateway marked healthy while UCC receives HTTP 502.
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - private-api

  docker-api-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      POST: "0"
      PING: "1"
      VERSION: "1"
    expose:
      - "2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/lib/haproxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring-api

  monitor:
    image: amir20/dozzle:v10.6.14
    depends_on:
      docker-api-proxy:
        condition: service_healthy
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_ENABLE_MCP: "false"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_FILTER: label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-medical-consultation}
      DOZZLE_REMOTE_HOST: tcp://docker-api-proxy:2375|${COMPOSE_PROJECT_NAME:-medical-consultation}
    ports:
      # Logs may contain sensitive operational details. Keep the UI on host
      # loopback and use an SSH tunnel for access from another workstation.
      - "127.0.0.1:${CONTAINER_MONITOR_PORT:-18080}:8080"
    volumes:
      - monitor-data:/data
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring
      - monitoring-api

networks:
  # Only Nginx joins the edge bridge. Host-published ports cannot be activated
  # from a container attached exclusively to an internal Docker network.
  edge:
    driver: bridge
  private-api:
    internal: true
  # Only the backend joins this network, so it can reach the chosen LLM/FHIR
  # providers without publishing the FastAPI container port on the host.
  backend-egress:
    driver: bridge
  # Host-loopback operational UI only; it is not connected to clinical
  # application networks and learns container state via the restricted proxy.
  monitoring:
    driver: bridge
  # Only Dozzle can reach the read-only Docker API proxy. The proxy has no host
  # port and permits only the API sections required for status and live logs.
  monitoring-api:
    internal: true

volumes:
  consultation-data:
  avatar-models:
  avatar-cache:
  monitor-data:
