<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="945" viewBox="0 0 1680 945" role="img" aria-labelledby="title desc">
  <title id="title">AI 預問診系統架構與四步驟流程</title>
  <desc id="desc">以淺色藍綠卡片呈現 SMART FHIR 病歷預填、病患問診、AI 合成病歷、醫師確認送出的四步驟流程，以及 Gateway、FastAPI 與相關資料服務。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4FAFF"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FFFE"/>
      <stop offset="1" stop-color="#E9F9F6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63B6FF"/>
      <stop offset="1" stop-color="#397EDF"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49C8C3"/>
      <stop offset="1" stop-color="#169D86"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#7B9BB7" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4B9BE7"/>
    </marker>
    <style>
      text { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif; fill: #10233D; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #536A83; }
      .layer { font-size: 15px; font-weight: 800; letter-spacing: 1.5px; fill: #57708B; }
      .step { font-size: 24px; font-weight: 800; fill: #FFF; }
      .card-title { font-size: 23px; font-weight: 800; }
      .body { font-size: 17px; font-weight: 500; fill: #3D5570; }
      .small { font-size: 14px; font-weight: 600; fill: #536A83; }
      .module-title { font-size: 20px; font-weight: 800; }
      .service-title { font-size: 18px; font-weight: 800; }
      .service-copy { font-size: 14px; font-weight: 500; fill: #536A83; }
      .chip { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1680" height="945" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="250" fill="#E5F3FF" opacity="0.30"/>
  <circle cx="250" cy="760" r="290" fill="#E3F8F4" opacity="0.24"/>

  <!-- Header -->
  <text x="60" y="56" class="title">AI 預問診系統｜架構與資料流</text>
  <text x="60" y="87" class="subtitle">依 1 → 2 → 3 → 4 完成病歷預填、病患問診、AI 草稿與醫師確認送出</text>
  <g transform="translate(1318 37)">
    <rect width="302" height="54" rx="15" fill="#F5F8FB" stroke="#D5E0EA"/>
    <circle cx="26" cy="27" r="7" fill="#F1AA4D"/>
    <text x="44" y="23" class="small">研究與合成資料原型</text>
    <text x="44" y="42" class="small">AI 產出需經醫師確認</text>
  </g>

  <text x="60" y="120" class="layer">主要流程｜由左至右</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="138" width="360" height="194" rx="18" fill="url(#blueCard)" stroke="#6AA9F1" stroke-width="1.5"/>
    <circle cx="101" cy="181" r="25" fill="url(#blue)"/>
    <text x="101" y="190" text-anchor="middle" class="step">1</text>
    <text x="139" y="176" class="card-title">SMART／FHIR 病歷預填</text>
    <text x="139" y="202" class="small">SMART on FHIR · OAuth／PKCE</text>
    <line x1="84" y1="224" x2="396" y2="224" stroke="#CFE0F1"/>
    <text x="84" y="255" class="body">取得 Patient／Encounter context</text>
    <text x="84" y="282" class="body">讀取 $everything 並映射既有病史</text>
    <rect x="84" y="297" width="248" height="23" rx="11" fill="#DDEBFF"/>
    <text x="98" y="313" class="chip" fill="#356CB4">SMART token 僅用於 FHIR Server</text>
  </g>

  <path d="M424 235H452" stroke="#4B9BE7" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="460" y="138" width="360" height="194" rx="18" fill="url(#tealCard)" stroke="#4CBFAF" stroke-width="1.5"/>
    <circle cx="501" cy="181" r="25" fill="url(#teal)"/>
    <text x="501" y="190" text-anchor="middle" class="step">2</text>
    <text x="539" y="176" class="card-title">病患端逐題問診</text>
    <text x="539" y="202" class="small">Patient frontend · Web／行動裝置</text>
    <line x1="484" y1="224" x2="796" y2="224" stroke="#CFE4E0"/>
    <text x="484" y="255" class="body">主訴選擇固定問卷，依 JSON 順序作答</text>
    <text x="484" y="282" class="body">支援文字、疼痛位置、國語／台語語音</text>
    <rect x="484" y="297" width="209" height="23" rx="11" fill="#D8F1EC"/>
    <text x="498" y="313" class="chip" fill="#147A69">一次性邀請 → HttpOnly session</text>
  </g>

  <path d="M824 235H852" stroke="#4B9BE7" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="860" y="138" width="360" height="194" rx="18" fill="url(#blueCard)" stroke="#6AA9F1" stroke-width="1.5"/>
    <circle cx="901" cy="181" r="25" fill="url(#blue)"/>
    <text x="901" y="190" text-anchor="middle" class="step">3</text>
    <text x="939" y="176" class="card-title">AI 合成病歷草稿</text>
    <text x="939" y="202" class="small">FastAPI · Chroma RAG · Gemini</text>
    <line x1="884" y1="224" x2="1196" y2="224" stroke="#CFE0F1"/>
    <text x="884" y="255" class="body">問卷完成後檢索 A／B／C 證據</text>
    <text x="884" y="282" class="body">產生六段式臨床決策草稿</text>
    <rect x="884" y="297" width="213" height="23" rx="11" fill="#DDEBFF"/>
    <text x="898" y="313" class="chip" fill="#356CB4">嚴格 schema 驗證 · fail closed</text>
  </g>

  <path d="M1224 235H1252" stroke="#4B9BE7" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1260" y="138" width="360" height="194" rx="18" fill="url(#tealCard)" stroke="#4CBFAF" stroke-width="1.5"/>
    <circle cx="1301" cy="181" r="25" fill="url(#teal)"/>
    <text x="1301" y="190" text-anchor="middle" class="step">4</text>
    <text x="1339" y="176" class="card-title">醫師確認與送出</text>
    <text x="1339" y="202" class="small">Doctor frontend · UCC／院內系統</text>
    <line x1="1284" y1="224" x2="1596" y2="224" stroke="#CFE4E0"/>
    <text x="1284" y="255" class="body">查看原始回答，逐段審閱與編輯</text>
    <text x="1284" y="282" class="body">確認後送出 FHIR Composition</text>
    <rect x="1284" y="297" width="196" height="23" rx="11" fill="#D8F1EC"/>
    <text x="1298" y="313" class="chip" fill="#147A69">未確認前不代表正式診斷</text>
  </g>

  <!-- Gateway -->
  <text x="60" y="374" class="layer">安全邊界與反向代理</text>
  <path d="M840 332V386" stroke="#4B9BE7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="397" width="1560" height="82" rx="18" fill="#F9FCFF" stroke="#8BB9E6" stroke-width="1.5"/>
    <rect x="82" y="414" width="12" height="48" rx="6" fill="url(#blue)"/>
    <text x="118" y="432" class="card-title">IIS + Nginx Gateway</text>
    <text x="118" y="457" class="body">TLS · 同源 API · CORS allowlist · doctor／patient 路由隔離 · 私有 upstream</text>
    <rect x="1300" y="412" width="294" height="51" rx="13" fill="#EAF2F8"/>
    <text x="1320" y="433" class="small">安全邊界</text>
    <text x="1320" y="453" class="body">FastAPI 不直接暴露公網 port</text>
  </g>

  <path d="M840 479V516" stroke="#4B9BE7" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- Backend -->
  <text x="60" y="514" class="layer">應用核心｜FASTAPI BACKEND</text>
  <g filter="url(#shadow)">
    <rect x="60" y="528" width="1560" height="207" rx="18" fill="#F9FCFF" stroke="#8BB9E6" stroke-width="1.5"/>
    <text x="83" y="565" class="card-title">Backend API</text>
    <text x="83" y="589" class="small">集中控管 HTTP 邊界、問診狀態、資料隔離、報告編排與外部整合</text>

    <rect x="82" y="610" width="345" height="103" rx="14" fill="url(#blueCard)" stroke="#A9CBEA"/>
    <text x="103" y="642" class="module-title">身分與資料隔離</text>
    <text x="103" y="669" class="body">JWT／scope／session</text>
    <text x="103" y="694" class="small">institution／encounter 邊界</text>

    <path d="M432 661H453" stroke="#4B9BE7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <rect x="460" y="610" width="345" height="103" rx="14" fill="url(#tealCard)" stroke="#9FD5CB"/>
    <text x="481" y="642" class="module-title">固定問卷引擎</text>
    <text x="481" y="669" class="body">主訴路由／逐題驗證</text>
    <text x="481" y="694" class="small">FHIR 已知欄位可略過</text>

    <path d="M810 661H831" stroke="#4B9BE7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <rect x="838" y="610" width="345" height="103" rx="14" fill="url(#blueCard)" stroke="#A9CBEA"/>
    <text x="859" y="642" class="module-title">RAG／Gemini 報告管線</text>
    <text x="859" y="669" class="body">最後一題完成後啟動</text>
    <text x="859" y="694" class="small">來源 provenance／嚴格 schema</text>

    <path d="M1188 661H1209" stroke="#4B9BE7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <rect x="1216" y="610" width="382" height="103" rx="14" fill="url(#tealCard)" stroke="#9FD5CB"/>
    <text x="1237" y="642" class="module-title">醫師工作區／FHIR API</text>
    <text x="1237" y="669" class="body">病例、原始回答、六段式草稿</text>
    <text x="1237" y="694" class="small">醫師確認後才可執行 Composition 回寫</text>
  </g>

  <!-- Services -->
  <text x="60" y="770" class="layer">資料、AI 與整合服務</text>
  <path d="M840 735V780H182M840 780H1497" fill="none" stroke="#82AED4" stroke-width="1.5"/>
  <g filter="url(#shadow)">
    <rect x="60" y="791" width="245" height="118" rx="15" fill="#FFF" stroke="#C9DBE9"/>
    <rect x="60" y="791" width="245" height="6" rx="3" fill="#42BDB5"/>
    <text x="81" y="827" class="service-title">固定問卷 JSON</text>
    <text x="81" y="852" class="service-copy">胸痛 · 頭痛 · 腹痛</text>
    <text x="81" y="875" class="service-copy">本機規則與輸入驗證</text>
    <rect x="81" y="884" width="120" height="18" rx="9" fill="#DDF2EE"/>
    <text x="93" y="897" class="chip" fill="#147A69">不靠 LLM 選題</text>

    <rect x="325" y="791" width="245" height="118" rx="15" fill="#FFF" stroke="#C9DBE9"/>
    <rect x="325" y="791" width="245" height="6" rx="3" fill="#42BDB5"/>
    <text x="346" y="827" class="service-title">本機 GPU 媒體</text>
    <text x="346" y="852" class="service-copy">Breeze ASR</text>
    <text x="346" y="875" class="service-copy">CosyVoice3 + MuseTalk</text>
    <rect x="346" y="884" width="131" height="18" rx="9" fill="#DDF2EE"/>
    <text x="358" y="897" class="chip" fill="#147A69">失效可用純文字</text>

    <rect x="590" y="791" width="245" height="118" rx="15" fill="#FFF" stroke="#C9DBE9"/>
    <rect x="590" y="791" width="245" height="6" rx="3" fill="#57A7EF"/>
    <text x="611" y="827" class="service-title">SQLite WAL</text>
    <text x="611" y="852" class="service-copy">病例 · session · invitation</text>
    <text x="611" y="875" class="service-copy">FHIR context · audit／revision</text>
    <rect x="611" y="884" width="108" height="18" rx="9" fill="#E1EEFB"/>
    <text x="623" y="897" class="chip" fill="#356CB4">持久化資料層</text>

    <rect x="855" y="791" width="245" height="118" rx="15" fill="#FFF" stroke="#C9DBE9"/>
    <rect x="855" y="791" width="245" height="6" rx="3" fill="#5791E9"/>
    <text x="876" y="827" class="service-title">Chroma RAG v2</text>
    <text x="876" y="852" class="service-copy">本機 embedding／檢索</text>
    <text x="876" y="875" class="service-copy">A／B／C metadata 分區</text>
    <rect x="876" y="884" width="132" height="18" rx="9" fill="#E1EEFB"/>
    <text x="888" y="897" class="chip" fill="#356CB4">附來源 provenance</text>

    <rect x="1120" y="791" width="245" height="118" rx="15" fill="#FFF" stroke="#C9DBE9"/>
    <rect x="1120" y="791" width="245" height="6" rx="3" fill="#789FEB"/>
    <text x="1141" y="827" class="service-title">Google Gemini</text>
    <text x="1141" y="852" class="service-copy">完整題目＋答案＋證據</text>
    <text x="1141" y="875" class="service-copy">產生六段式臨床草稿</text>
    <rect x="1141" y="884" width="128" height="18" rx="9" fill="#E6EDFB"/>
    <text x="1153" y="897" class="chip" fill="#4969AA">院方隱私審查必須</text>

    <rect x="1385" y="791" width="235" height="118" rx="15" fill="#FFF" stroke="#C9DBE9"/>
    <rect x="1385" y="791" width="235" height="6" rx="3" fill="#42BDB5"/>
    <text x="1406" y="827" class="service-title">FHIR／術語服務</text>
    <text x="1406" y="852" class="service-copy">HAPI FHIR R4 · TW Core</text>
    <text x="1406" y="875" class="service-copy">SNOMED CT · Composition</text>
    <rect x="1406" y="884" width="167" height="18" rx="9" fill="#DDF2EE"/>
    <text x="1418" y="897" class="chip" fill="#147A69">SMART token 不送往 AI</text>
  </g>

  <text x="60" y="932" class="small">預設逐題問卷不使用 AMIE、Safety、疾病票數或 RAG；AI 草稿未經合格醫師確認前，不代表正式診斷或醫囑。</text>
</svg>
