<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>本機 SMART on FHIR</title>
    <script src="/vendor/fhir-client.js"></script>
    <style>
      :root {
        color: #16302b;
        background: #f2f7f5;
        font: 16px/1.6 system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        width: min(960px, 100%);
        margin: auto;
        padding: 40px 20px;
      }
      header, section {
        margin-bottom: 20px;
        padding: 24px;
        border: 1px solid #d7e4df;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 34px rgb(25 67 57 / 8%);
      }
      h1, h2 { margin-top: 0; }
      h1 { font-size: clamp(1.8rem, 4vw, 3rem); }
      h2 { font-size: 1.1rem; color: #287160; }
      pre {
        max-height: 360px;
        overflow: auto;
        margin: 0;
        padding: 16px;
        border-radius: 10px;
        color: #dff8ef;
        background: #122a25;
        font: 13px/1.55 ui-monospace, monospace;
        white-space: pre-wrap;
      }
      .status { color: #48645d; }
      .error { color: #a4262c; }
      a { color: #176b57; }
    </style>
  </head>
  <body>
    <header>
      <p class="status" id="status">正在完成 SMART 授權……</p>
      <h1>SMART on FHIR 已連線</h1>
      <p>
        這個頁面透過 OAuth access token 讀取目前 Launch Context 中的病人資料，
        不會直接存取未受保護的 HAPI 端點。
      </p>
    </header>

    <section>
      <h2>目前病人</h2>
      <pre id="patient">載入中……</pre>
    </section>

    <section>
      <h2>MedicationRequest</h2>
      <pre id="medications">載入中……</pre>
    </section>

    <script>
      const status = document.getElementById("status");
      const patientOutput = document.getElementById("patient");
      const medicationOutput = document.getElementById("medications");

      function render(target, value) {
        target.textContent = JSON.stringify(value, null, 2);
      }

      function renderError(target, error) {
        target.textContent = error?.stack || String(error);
        target.classList.add("error");
      }

      FHIR.oauth2
        .ready()
        .then(async (client) => {
          if (!client.patient?.id) {
            throw new Error("Launch Context 沒有 patient id，請在 Launcher 選擇病人。");
          }

          status.textContent =
            `已授權；FHIR Server：${client.state.serverUrl}；Patient：${client.patient.id}`;

          const [patient, medications] = await Promise.all([
            client.patient.read(),
            client.request(
              `MedicationRequest?patient=${encodeURIComponent(client.patient.id)}`,
              { flat: true },
            ),
          ]);

          render(patientOutput, patient);
          render(medicationOutput, medications);
        })
        .catch((error) => {
          status.textContent =
            "尚未取得 SMART Launch Context。請從 SMART Launcher 啟動此 App。";
          status.classList.add("error");
          renderError(patientOutput, error);
          medicationOutput.textContent = "等待成功授權。";
        });
    </script>
  </body>
</html>
