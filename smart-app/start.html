<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>本機 SMART on FHIR 測試入口</title>
    <style>
      :root {
        color: #16302b;
        background: #f2f7f5;
        font: 16px/1.6 system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        width: min(760px, 100%);
        margin: auto;
        padding: 56px 20px;
      }
      main {
        padding: clamp(24px, 6vw, 52px);
        border: 1px solid #d7e4df;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(25 67 57 / 10%);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.6rem);
        line-height: 1.1;
      }
      p { color: #48645d; }
      .actions {
        display: grid;
        gap: 12px;
        margin-top: 32px;
      }
      a {
        display: block;
        padding: 14px 18px;
        border-radius: 10px;
        color: #fff;
        background: #176b57;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }
      a:hover { background: #0f5545; }
      small {
        display: block;
        margin-top: 24px;
        color: #6d827c;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Local development sandbox</p>
      <h1>SMART on FHIR</h1>
      <p>
        選擇一筆合成病人，從本機 SMART Launcher 開始 Provider EHR Launch。
        授權完成後，App 會顯示病人與 MedicationRequest。
      </p>
      <div class="actions">
        <a
          href="http://127.0.0.1:8090/launcher?launch_uri=http%3A%2F%2F127.0.0.1%3A5174%2Flaunch.html&amp;fhir_ver=4&amp;patient=syn-chest-001"
        >
          啟動「合成胸痛測試病人」
        </a>
        <a
          href="http://127.0.0.1:8090/launcher?launch_uri=http%3A%2F%2F127.0.0.1%3A5174%2Flaunch.html&amp;fhir_ver=4&amp;patient=syn-wang-daming-001"
        >
          啟動「王大明」
        </a>
      </div>
      <small>只可使用合成測試資料；不可放入真實病歷。</small>
    </main>
  </body>
</html>
