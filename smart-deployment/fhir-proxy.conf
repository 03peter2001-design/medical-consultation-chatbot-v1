server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # HAPI pagination links point at its canonical /fhir base. The SMART
    # launcher exposes that upstream at its own /v/r4/fhir base, so clients can
    # resolve a next link as /v/r4/fhir/fhir. Accept that single compatibility
    # alias without exposing another upstream or changing resource paths.
    location = /fhir {
        proxy_pass http://hapi:8080/fhir;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://hapi:8080/fhir/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
