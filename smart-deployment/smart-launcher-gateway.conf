map $http_origin $smart_cors_origin {
    default "";
    "~^http://127\.0\.0\.1:[0-9]+$" $http_origin;
    "~^http://localhost:[0-9]+$" $http_origin;
}

server {
    listen 80;
    server_name _;

    location / {
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://smart-launcher;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin $smart_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Cache-Control, Pragma" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
    }
}
