<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 預問診系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0b0f14;
    --s1:       #111822;
    --s2:       #182030;
    --border:   #1e2d3d;
    --border2:  #2a3f55;
    --accent:   #00c896;
    --blue:     #4fa3e0;
    --text:     #d4e4f4;
    --muted:    #4a6478;
    --danger:   #e05252;
    --r:        10px;
    --header-h: 52px;
    --input-h:  64px;
  }

  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Noto Serif TC',serif; }

  #app { display:flex; flex-direction:column; width:100vw; height:100vh; overflow:hidden; }

  #header {
    height:var(--header-h); flex-shrink:0; background:var(--s1); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px; gap:10px; z-index:10;
  }
  #header .logo { width:28px; height:28px; background:var(--accent); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  #header h1 { font-size:15px; font-weight:600; letter-spacing:.04em; }
  #header .badge { margin-left:auto; font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--accent); background:rgba(0,200,150,.1); border:1px solid rgba(0,200,150,.3); border-radius:6px; padding:3px 10px; }

  #main { flex:1; display:flex; overflow:hidden; }

  #right { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

  #progressBar { flex-shrink:0; height:44px; padding:0 20px; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); background:var(--s1); }
  .step-pip { width:7px; height:7px; border-radius:50%; background:var(--border2); transition:background .3s,transform .2s; flex-shrink:0; }
  .step-pip.done    { background:var(--accent); }
  .step-pip.current { background:var(--blue); transform:scale(1.3); animation:blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  #stepText { margin-left:auto; font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted); }

  #chatbox { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
  #chatbox::-webkit-scrollbar { width:4px; }
  #chatbox::-webkit-scrollbar-track { background:transparent; }
  #chatbox::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }

  .msg { display:flex; flex-direction:column; gap:3px; max-width:72%; animation:popIn .2s ease; }
  @keyframes popIn { from{opacity:0;transform:translateY(10px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
  .msg.user { align-self:flex-end;   align-items:flex-end; }
  .msg.ai   { align-self:flex-start; align-items:flex-start; }
  .msg .who { font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--muted); letter-spacing:.06em; padding:0 4px; }
  .msg.ai   .bubble { background:var(--s2); border:1px solid var(--border); color:var(--text); border-radius:3px 12px 12px 12px; padding:10px 14px; font-size:14px; line-height:1.75; }
  .msg.user .bubble { background:var(--accent); color:#001a12; border-radius:12px 3px 12px 12px; padding:10px 14px; font-size:14px; line-height:1.75; }

  .report { align-self:stretch; border:1px solid var(--accent); background:rgba(0,200,150,.05); border-radius:var(--r); padding:16px 18px; animation:popIn .3s ease; }
  .report h3 { font-size:12px; color:var(--accent); letter-spacing:.08em; margin-bottom:10px; font-family:'JetBrains Mono',monospace; }
  .report pre { font-family:'Noto Serif TC',serif; font-size:13px; white-space:pre-wrap; line-height:1.85; color:var(--text); }

  #inputBar { flex-shrink:0; height:var(--input-h); padding:0 16px; display:flex; align-items:center; gap:8px; border-top:1px solid var(--border); background:var(--s1); }
  #inputBar input { flex:1; background:var(--s2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px 14px; font-size:14px; font-family:'Noto Serif TC',serif; outline:none; transition:border-color .2s; height:42px; }
  #inputBar input:focus { border-color:var(--blue); }
  #inputBar input::placeholder { color:var(--muted); opacity:.6; }
  #inputBar input:disabled { opacity:.35; }

  .icon-btn { width:42px; height:42px; background:var(--s2); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center; transition:background .15s,border-color .15s; flex-shrink:0; }
  .icon-btn:hover { background:var(--border); border-color:var(--border2); }
  .icon-btn:disabled { opacity:.3; cursor:not-allowed; }
  .icon-btn.send { background:var(--accent); border-color:var(--accent); color:#001a12; }
  .icon-btn.send:hover { opacity:.85; }
  .icon-btn.recording { background:var(--danger); border-color:var(--danger); }
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <div class="logo">🩺</div>
    <h1>AI 預問診系統</h1>
    <div class="badge">🧪 語音測試模式</div>
  </div>

  <div id="main">
    <div id="right">
      <div id="progressBar">
        <div class="step-pip current" id="p1"></div>
        <div class="step-pip" id="p2"></div>
        <div class="step-pip" id="p3"></div>
        <div class="step-pip" id="p4"></div>
        <div class="step-pip" id="p5"></div>
        <span id="stepText">步驟 1 / 5 — 就診原因</span>
      </div>
      <div id="chatbox"></div>
      <div id="inputBar">
        <input type="text" id="textInput" placeholder="請輸入您的回覆..." disabled />
        <button class="icon-btn" id="btnMic" onclick="startVoice()" disabled>🎤</button>
        <button class="icon-btn send" id="btnSend" onclick="sendMessage()" disabled>➤</button>
      </div>
    </div>
  </div>
</div>

<script>
const SESSION_ID = Date.now().toString();
const BACKEND    = "http://127.0.0.1:8000";
const STEP_NAMES = ["","就診原因","性別","年齡","症狀描述","病史"];

let isCompleted = false;
let currentStep = 1;

const chatbox   = document.getElementById("chatbox");
const textInput = document.getElementById("textInput");
const btnSend   = document.getElementById("btnSend");
const btnMic    = document.getElementById("btnMic");

// ── 頁面載入後自動開始 ──
window.addEventListener("load", async () => {
  navigator.mediaDevices?.getUserMedia?.({audio:true})
    .then(s => s.getTracks().forEach(t => t.stop()))
    .catch(() => {});
  await startConsultation();
});

// ── Chat ──
async function startConsultation() {
  setInputsDisabled(true);
  const data = await callBackend("");
  if (!data) { setInputsDisabled(false); return; }
  addBubble("ai", data.reply);
  updateProgress(1);
  setInputsDisabled(false);
  textInput.focus();
}

async function sendMessage() {
  if (isCompleted) return;
  const msg = textInput.value.trim();
  if (!msg) return;
  addBubble("user", msg);
  textInput.value = "";
  setInputsDisabled(true);

  const data = await callBackend(msg);
  if (!data) { setInputsDisabled(false); return; }

  if (data.completed) {
    showReport(data.reply);
    isCompleted = true;
    updateProgress(6);
  } else {
    addBubble("ai", data.reply);
    currentStep = Math.min(currentStep + 1, 5);
    updateProgress(currentStep);
    setInputsDisabled(false);
    textInput.focus();
  }
}

async function callBackend(message) {
  try {
    const r = await fetch(`${BACKEND}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: SESSION_ID })
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    addBubble("ai", "⚠️ 無法連接後端（" + e.message + "），請確認 FastAPI 已啟動。");
    return null;
  }
}

function addBubble(role, text) {
  const wrap = document.createElement("div"); wrap.className = "msg " + role;
  const who  = document.createElement("div"); who.className = "who"; who.textContent = role === "ai" ? "AI 助理" : "您";
  const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = text;
  wrap.appendChild(who); wrap.appendChild(bubble);
  chatbox.appendChild(wrap); chatbox.scrollTop = chatbox.scrollHeight;
}

function showReport(text) {
  const card = document.createElement("div"); card.className = "report";
  card.innerHTML = `<h3>📋 AI 預問診報告</h3><pre>${text}</pre>`;
  chatbox.appendChild(card); chatbox.scrollTop = chatbox.scrollHeight;
}

function setInputsDisabled(v) { textInput.disabled = v; btnSend.disabled = v; btnMic.disabled = v; }

function updateProgress(step) {
  for (let i = 1; i <= 5; i++) {
    document.getElementById("p" + i).className = "step-pip" + (i < step ? " done" : i === step ? " current" : "");
  }
  document.getElementById("stepText").textContent =
    step > 5 ? "問診完成 ✓" : `步驟 ${step} / 5 — ${STEP_NAMES[step]}`;
}

// ── 語音輸入 ──
let mediaRecorder = null, audioChunks = [], isRecording = false;

async function startVoice() {
  if (isCompleted) return;
  if (isRecording) { mediaRecorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount:1, sampleRate:16000, echoCancellation:true, noiseSuppression:true }
    });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      isRecording = false; btnMic.textContent = "🎤"; btnMic.classList.remove("recording");
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: "audio/webm;codecs=opus" });
      const form = new FormData(); form.append("audio", blob, "audio.webm");
      btnMic.disabled = true; btnMic.textContent = "⏳";
      try {
        const res = await fetch(`${BACKEND}/transcribe`, { method: "POST", body: form });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.text && data.text.trim()) {
          textInput.value = data.text.trim();
          sendMessage();
        } else {
          addBubble("ai", "⚠️ 未偵測到語音內容，請再試一次。");
        }
      } catch (e) {
        addBubble("ai", "⚠️ 語音辨識失敗（" + e.message + "），請重試。");
      } finally {
        btnMic.disabled = false; btnMic.textContent = "🎤";
      }
    };
    mediaRecorder.start();
    isRecording = true; btnMic.textContent = "⏹️"; btnMic.classList.add("recording");
  } catch (e) {
    addBubble("ai", "⚠️ 無法存取麥克風：" + e.message);
  }
}

textInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

window.sendMessage  = sendMessage;
window.startVoice   = startVoice;
</script>
</body>
</html>
